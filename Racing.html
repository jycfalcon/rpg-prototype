<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽馬</title>
<style>
:root {
  --bg: #0a1a0a;
  --surface: #111f11;
  --gold: #FFD700;
  --text: #f0ede8;
  --soft: #7a8a74;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  overflow: hidden;
}
.screen {
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  align-items: stretch;
  padding:
    max(env(safe-area-inset-top, 0px), 16px)
    max(env(safe-area-inset-right, 0px), 16px)
    max(env(safe-area-inset-bottom, 0px), 20px)
    max(env(safe-area-inset-left, 0px), 16px);
}
.screen.on { display: flex; }

.pick-title {
  font-size: 26px;
  text-align: center;
  margin-bottom: 16px;
  color: var(--gold);
  letter-spacing: 3px;
  font-weight: 700;
}
.horse-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
  flex: 1;
}
.hcard {
  border-radius: var(--radius);
  border: 2px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.12s;
  min-height: 90px;
}
.hcard:active { opacity: 0.8; }
.hcard.sel {
  border-color: var(--gold);
  background: rgba(255,215,0,0.08);
}
.hcard canvas { border-radius: 6px; display: block; }
.hnum { font-size: 26px; font-weight: 800; line-height: 1; }

.go-btn {
  margin-top: 14px;
  background: var(--gold);
  color: #111;
  border: none;
  border-radius: var(--radius);
  font-size: 24px;
  font-weight: 800;
  padding: 16px;
  width: 100%;
  cursor: pointer;
  display: none;
  letter-spacing: 4px;
  -webkit-tap-highlight-color: transparent;
}
.go-btn.show { display: block; }
.go-btn:active { opacity: 0.85; }

#race-screen { padding: 0; }
#track { width: 100%; height: 100%; display: block; }

#result-screen {
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.rbox {
  width: 100%;
  max-width: 300px;
  border-radius: 20px;
  padding: 36px 24px;
  text-align: center;
  border: 2px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
}
.rbox.win {
  border-color: var(--gold);
  background: rgba(255,215,0,0.1);
}
.rtrophy { font-size: 60px; margin-bottom: 6px; }
.rnum { font-size: 80px; font-weight: 900; line-height: 1; margin: 6px 0; }
.rlabel { font-size: 28px; margin-bottom: 28px; letter-spacing: 4px; }
.retry {
  background: var(--gold);
  color: #111;
  border: none;
  border-radius: var(--radius);
  font-size: 22px;
  font-weight: 800;
  padding: 16px 44px;
  cursor: pointer;
  letter-spacing: 2px;
  -webkit-tap-highlight-color: transparent;
}
.retry:active { opacity: 0.85; }
</style>
</head>
<body>

<div class="screen on" id="pick-screen">
  <div class="pick-title">🏇 賽馬 🏇</div>
  <div class="horse-grid" id="hgrid"></div>
  <button class="go-btn" id="gobtn" onclick="beginRace()">出 發 ！</button>
</div>

<div class="screen" id="race-screen">
  <canvas id="track"></canvas>
</div>

<div class="screen" id="result-screen">
  <div class="rbox" id="rbox">
    <div class="rtrophy" id="rtrophy"></div>
    <div class="rnum" id="rnum"></div>
    <div class="rlabel" id="rlabel"></div>
    <button class="retry" onclick="goBack()">再玩</button>
  </div>
</div>

<script>
const CFG = [
  { n:1, silk:'#CC2200', cap:'#FFFFFF' },
  { n:2, silk:'#1A56CC', cap:'#FFD700' },
  { n:3, silk:'#228B22', cap:'#FFFFFF' },
  { n:4, silk:'#8B008B', cap:'#FFD700' },
  { n:5, silk:'#CC6600', cap:'#000000' },
  { n:6, silk:'#111111', cap:'#FFFFFF' },
];

let picked = null, horses = [], raf = null, frame = 0, done = false, champ = null;
const FINISH = 3400;

function luma(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255;
}
function fg(hex){ return luma(hex)>0.45?'#111':'#fff'; }

// Build pick screen
const grid = document.getElementById('hgrid');
CFG.forEach((c,i) => {
  const card = document.createElement('div');
  card.className = 'hcard';
  card.dataset.i = i;

  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 50;
  cv.style.width = '64px'; cv.style.height = '50px';
  const cx = cv.getContext('2d');
  cx.fillStyle = c.cap;
  cx.fillRect(0,0,64,22);
  cx.fillStyle = c.silk;
  cx.fillRect(0,22,64,28);
  cx.fillStyle = fg(c.silk);
  cx.font = 'bold 20px sans-serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(c.n, 32, 36);

  const num = document.createElement('div');
  num.className = 'hnum';
  num.textContent = c.n;
  num.style.color = c.silk === '#111111' ? '#ccc' : c.silk;

  card.appendChild(cv);
  card.appendChild(num);
  card.addEventListener('click', () => pick(i));
  grid.appendChild(card);
});

function pick(i) {
  picked = i;
  document.querySelectorAll('.hcard').forEach((c,j) => c.classList.toggle('sel', j===i));
  document.getElementById('gobtn').classList.add('show');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function beginRace() {
  if (picked === null) return;
  horses = CFG.map(c => ({
    ...c,
    pos: 0,
    vel: 1.3 + Math.random()*0.5,
    tv: 1.3 + Math.random()*0.5,
  }));
  frame = 0; done = false; champ = null;

  const cv = document.getElementById('track');
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  show('race-screen');
  raf = requestAnimationFrame(() => loop(ctx, W, H));
}

function loop(ctx, W, H) {
  frame++;

  horses.forEach(h => {
    h.tv = 1.1 + Math.random()*0.7;
    if (h.pos > FINISH*0.78 && Math.random()<0.018) h.tv += 0.7;
    h.vel += (h.tv - h.vel)*0.09;
    h.vel = Math.max(0.7, Math.min(3.0, h.vel));
    h.pos += h.vel;
    if (!done && h.pos >= FINISH) { done = true; champ = h; }
  });

  const leader = horses.reduce((a,b)=>a.pos>b.pos?a:b);
  const cam = Math.max(0, leader.pos - W*0.33);

  drawBG(ctx, W, H, cam);
  horses.forEach((h,i) => {
    const lh = H/horses.length;
    drawHorse(ctx, h.pos - cam, lh*i + lh*0.5, h, frame, i===picked);
  });
  drawFinish(ctx, W, H, FINISH - cam);

  if (done) { setTimeout(()=>showResult(), 900); return; }
  raf = requestAnimationFrame(()=>loop(ctx, W, H));
}

function drawBG(ctx, W, H, cam) {
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#2a1a0a';
  const trackH = H * 0.86;
  ctx.fillRect(0, H*0.07, W, trackH);

  const lh = H/6;
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  for (let i=1;i<6;i++) {
    ctx.beginPath(); ctx.moveTo(0,lh*i); ctx.lineTo(W,lh*i); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1.5;
  const sp = 150, off = cam%sp;
  for (let x=-off; x<W; x+=sp) {
    ctx.beginPath(); ctx.moveTo(x,H*0.07); ctx.lineTo(x,H); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(0, H*0.07, W, 3);
  ctx.fillRect(0, H-3, W, 3);
}

function drawFinish(ctx, W, H, fx) {
  if (fx < -20 || fx > W+20) return;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.setLineDash([12,6]);
  ctx.beginPath(); ctx.moveTo(fx,0); ctx.lineTo(fx,H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#CC2200';
  ctx.fillRect(fx, 0, 28, 22);
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx, 0, 14, 11);
  ctx.fillRect(fx+14, 11, 14, 11);
}

function drawHorse(ctx, x, y, h, fr, isSel) {
  if (x<-50 || x>ctx.canvas.width/(window.devicePixelRatio||1)+50) return;
  const t = fr*0.38;
  ctx.save();
  ctx.translate(x, y);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(2,12,15,4,0,0,Math.PI*2);
  ctx.fill();

  // body
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath();
  ctx.ellipse(0,0,16,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#9B6E4C';
  ctx.beginPath();
  ctx.ellipse(-5,-2,7,5,0.3,0,Math.PI*2);
  ctx.fill();

  // neck+head
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath();
  ctx.moveTo(11,-3); ctx.lineTo(17,-12); ctx.lineTo(20,-10); ctx.lineTo(14,-1);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(21,-12,6,4,-0.4,0,Math.PI*2); ctx.fill();

  // eye
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(21,-14,2,1.5,-0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(21.5,-14,1,0,Math.PI*2); ctx.fill();

  // ear
  ctx.fillStyle='#8B5E3C';
  ctx.beginPath();
  ctx.moveTo(17,-17); ctx.lineTo(19,-21); ctx.lineTo(21,-17);
  ctx.closePath(); ctx.fill();

  // tail
  ctx.strokeStyle='#5C3D1E'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-15,-1);
  ctx.quadraticCurveTo(-24,1+Math.sin(t)*2.5,-22,11);
  ctx.stroke();

  // legs
  ctx.strokeStyle='#5C3D1E'; ctx.lineWidth=2.2; ctx.lineCap='round';
  [[9,t],[7,t+Math.PI],[-7,t+Math.PI/2],[-9,t+3*Math.PI/2]].forEach(([bx,ph])=>{
    const sx=Math.sin(ph)*7, sy=Math.abs(Math.sin(ph))*3;
    ctx.beginPath();
    ctx.moveTo(bx,7);
    ctx.lineTo(bx+sx*0.6,12-sy);
    ctx.lineTo(bx+sx,16-sy);
    ctx.stroke();
  });

  // jockey
  ctx.fillStyle = h.silk;
  ctx.beginPath(); ctx.ellipse(3,-12,6,7,-0.15,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = h.cap;
  ctx.beginPath(); ctx.ellipse(5,-18,6,3.5,-0.2,0,Math.PI*2); ctx.fill();
  ctx.fillRect(0,-19,10,3);

  // number cloth
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.fillRect(-2,-7,10,8);
  ctx.fillStyle='#111';
  ctx.font='bold 7px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(h.n, 3,-1);

  // selected indicator
  if (isSel) {
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2.5;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.ellipse(0,-2,21,13,0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#FFD700';
    ctx.font='16px sans-serif'; ctx.textAlign='center';
    ctx.fillText('★',0,-33);
  }

  ctx.restore();
}

function showResult() {
  if (raf) cancelAnimationFrame(raf);
  const win = champ.n === CFG[picked].n;
  const box = document.getElementById('rbox');
  box.className = 'rbox' + (win?' win':'');
  document.getElementById('rtrophy').textContent = win ? '🏆' : '🎽';
  document.getElementById('rnum').textContent = champ.n;
  document.getElementById('rnum').style.color = champ.silk==='#111111'?'#ccc':champ.silk;
  const sorted = [...horses].sort((a,b)=>b.pos-a.pos);
  const place = sorted.findIndex(h=>h.n===CFG[picked].n)+1;
  if (win) {
    document.getElementById('rlabel').textContent = '恭喜！';
    document.getElementById('rlabel').style.color = '#FFD700';
  } else {
    const marks = ['','🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
    document.getElementById('rlabel').textContent = marks[place]||'';
    document.getElementById('rlabel').style.color = '#aaa';
  }
  show('result-screen');
}

function goBack() {
  picked = null;
  document.querySelectorAll('.hcard').forEach(c=>c.classList.remove('sel'));
  document.getElementById('gobtn').classList.remove('show');
  show('pick-screen');
}
</script>
</body>
</html>
