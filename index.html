<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>RPG Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; overflow: hidden; touch-action: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
c.style.cursor = 'crosshair';
c.width = window.innerWidth; c.height = window.innerHeight;
let canvasRect = c.getBoundingClientRect();
window.addEventListener('resize',()=>{c.width=window.innerWidth;c.height=window.innerHeight;canvasRect=c.getBoundingClientRect();});

// ── CONSTANTS ─────────────────────────────────────────────────────────────
const W=2400,H=2400;
const P_SPEED=130,P_HP=50,P_ATK=3,P_REGEN=1;
const ATK_RANGE=80,ATK_DURATION=0.3,ATK_CD=0.55;
const SWORD_IDLE=Math.PI*0.15;
const ROLL_SPEED=340,ROLL_DURATION=0.36,ROLL_CD=1.6;
const SPAWN_INTERVAL=20,MAX_SLIMES=20,SPAWN_BATCH_MIN=4;
const STUN_DURATION=5.0;

// Normal slime
const S_HP=15,S_ATK=3,S_SPEED=105,S_R=14;
// Giant
const G_HP=70,G_ATK=8,G_SPEED=62,G_R=26;
// Slime King
const K_HP=200,K_SPEED=48,K_R=40;
const K_NORMAL_ATK=6,K_LUNGE_ATK=14,K_EQ_ATK=20;
const K_NORMAL_ATK_RANGE=65,K_LUNGE_START_RANGE=200,K_EQ_TRIGGER_RANGE=220;
const K_EQ_RADIUS=175,K_EQ_WINDUP=2.2;
const K_NORMAL_ATK_CD=2.5,K_LUNGE_CD=8.0,K_EQ_CD=16.0;

// Shared attack constants
const NORMAL_ATK_RANGE=55,NORMAL_ATK_CD=1.8;
const BOUNCE_SPEED=155,BOUNCE_DURATION=0.45,HOP_HEIGHT=26,BOUNCE_ABORT_DIST=85;
const LUNGE_START_RANGE=150,LUNGE_SKILL_CD=6.0;
const WINDUP_NORMAL=0.55,WINDUP_GIANT=0.75;
const LUNGE_DURATION=0.32,LUNGE_SPEED=360,RECOVERY_DUR=0.38;
const AGGRO_RANGE=210,DEAGGRO_RANGE=380;
const ROAM_SPEED=0.38,ROAM_INT_MIN=5,ROAM_INT_MAX=10,ROAM_RADIUS=130;

// ── MULTIPLAYER ───────────────────────────────────────────────────────────
// After deploying server to Railway, paste your URL here:
const WS_URL = 'wss://rpg-prototype-production.up.railway.app';

let ws = null, myId = null, wsStatus = 'connecting';
const others = {}; // id → interpolated player state
let sendTick  = 0;

function connectWS() {
  wsStatus = 'connecting';
  try { ws = new WebSocket(WS_URL); } catch(e) { wsStatus = 'offline'; return; }
  ws.onopen  = () => { wsStatus = 'online'; };
  ws.onclose = () => { wsStatus = 'reconnecting'; setTimeout(connectWS, 3000); };
  ws.onerror = () => {};
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'welcome') {
        myId = msg.id;
        for (const s of msg.others) others[s.id] = { ...s, x: s.x, y: s.y, tx: s.x, ty: s.y };
        if (msg.slimes) slimes = msg.slimes.map(s => ({...s, alive: true}));
      }
      if (msg.type === 'state') {
        const p = msg.player;
        if (!others[p.id]) { others[p.id] = { ...p, tx: p.x, ty: p.y }; }
        else { others[p.id].tx = p.x; others[p.id].ty = p.y; Object.assign(others[p.id], p, { x: others[p.id].x, y: others[p.id].y }); }
      }
      if (msg.type === 'join') {
        others[msg.id] = { id:msg.id, x:W/2, y:H/2, tx:W/2, ty:H/2, hp:P_HP, facing:'down', rolling:false, atkTimer:0, atkAngle:0, dead:false, stunned:false };
      }
      if (msg.type === 'leave') delete others[msg.id];

      // ── Server world state ───────────────────────────────────────────
      if (msg.type === 'world') {
        slimes = msg.slimes.map(s => ({...s, alive: true}));
        if (targetSlime) targetSlime = slimes.find(s => s.id === targetSlime.id) || null;
      }
      if (msg.type === 'player_hit') {
        if (rolling && rollInvincible) {
          addFloat(player.x, player.y-36, 'DODGE!', '#88aaff', 19);
          burst(player.x, player.y, '#88aaff', 8);
        } else {
          player.hp = Math.max(0, player.hp - msg.amount);
          player.flash = 0.25;
          burst(player.x, player.y, '#e74c3c', 5);
          if (msg.stun && !player.dead) {
            stunned = true; stunTimer = msg.stun;
            addFloat(player.x, player.y-44, 'STUNNED!', '#f1c40f', 20);
          }
          if (player.hp <= 0) player.dead = true;
        }
      }
      if (msg.type === 'slime_hit') {
        // Immediate local flash + floater before next world tick
        const s = slimes.find(s => s.id === msg.slimeId);
        if (s) { s.flash = 0.15; s.hp = msg.hp; }
        addFloat(msg.x, msg.y - 14, `-${P_ATK}`, '#ff8888', 19);
        burst(msg.x, msg.y, '#5bff8a', 5);
      }
      if (msg.type === 'slime_killed') {
        burst(msg.x, msg.y, msg.isKing?'#7b00d4':msg.isGiant?'#c0392b':'#27ae60', msg.isKing?30:msg.isGiant?20:14);
        addFloat(msg.x, msg.y-30, msg.isKing?'KING SLAIN!':msg.isGiant?'GIANT SLAY!':'SLAY!', msg.isKing?'#a855f7':'#f1c40f', msg.isKing?20:msg.isGiant?16:14);
        if (targetSlime && targetSlime.id === msg.slimeId) { targetSlime = null; autoMove = false; }
      }
      if (msg.type === 'earthquake_hit') {
        burst(msg.x, msg.y, '#ff4500', 25);
        for (let i=0;i<24;i++){const a=Math.random()*Math.PI*2,d=Math.random()*msg.radius;burst(msg.x+Math.cos(a)*d,msg.y+Math.sin(a)*d,Math.random()<0.5?'#ff4500':'#e67e22',3);}
        spawnCracks(msg.x, msg.y, msg.radius);
      }
      if (msg.type === 'slime_aggro') {
        // Show aggro float — find slime position
        const s = slimes.find(s => s.id === msg.slimeId);
        if (s) addFloat(s.x, s.y-s.r-10, msg.isKing?'👑!':'!', msg.isKing?'#a855f7':'#e74c3c', msg.isKing?16:14);
      }
      if (msg.type === 'float') {
        addFloat(msg.x, msg.y, msg.text, msg.color, msg.size);
      }
    } catch(_) {}
  };
}
connectWS();

// ── STATE ──────────────────────────────────────────────────────────────────
let cam={x:W/2-c.width/2,y:H/2-c.height/2};
let keys={};
let player={x:W/2,y:H/2,hp:P_HP,regen:0,facing:'down',atkCd:0,atkTimer:0,atkAngle:SWORD_IDLE,flash:0,dead:false};
let stunned=false,stunTimer=0;
let targetSlime=null,autoMove=false,autoAttackedOnce=false;
let rolling=false,rollTimer=0,rollCd=0,rollAngle=0,rollInvincible=false,rollTrail=[];
let mouseDown=false;
let slimes=[],particles=[],floaters=[],cracks=[];
let spawnT=10,totalSpawned=0;
let isTouchDevice=false;
const joy={active:false,id:-1,bx:0,by:0,kx:0,ky:0,dx:0,dy:0,R:58,r:24};
let atkBtnFlash=0,atkBtnHeld=false,atkBtnTouchId=-1;
let rollBtnFlash=0,rollBtnTouchId=-1;
function getAtkBtn(){return{x:c.width-70,y:c.height-210,r:46};}
function getRollBtn(){return{x:c.width-160,y:c.height-210,r:36};}
function getDeadBtn(){const bw=210,bh=46;return{x:c.width/2-bw/2,y:c.height/2+42,w:bw,h:bh};}

// ── ROLL ───────────────────────────────────────────────────────────────────
function startRoll(dx,dy){
  if(rolling||rollCd>0||player.dead||stunned)return;
  const mag=Math.hypot(dx,dy);
  rollAngle=mag>0.1?Math.atan2(dy,dx):{right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[player.facing];
  rolling=true;rollTimer=ROLL_DURATION;rollCd=ROLL_CD;autoMove=false;
}

// ── TARGETING ──────────────────────────────────────────────────────────────
function pickTarget(wx,wy){
  let best=null,bestDist=Infinity;
  for(const s of slimes){if(!s.alive)continue;const d=Math.hypot(wx-s.x,wy-s.y);if(d<s.r+16&&d<bestDist){best=s;bestDist=d;}}
  if(best){best.state='aggro';targetSlime=best;autoMove=true;autoAttackedOnce=false;}
  else{targetSlime=null;autoMove=false;}
}

// ── ATTACK ─────────────────────────────────────────────────────────────────
function triggerAttackOnTarget(){
  if(player.dead||player.atkCd>0||stunned)return;
  if(!targetSlime||!targetSlime.alive)return;
  const dx=targetSlime.x-player.x,dy=targetSlime.y-player.y;
  if(Math.hypot(dx,dy)>ATK_RANGE+targetSlime.r)return;
  const angle=Math.atan2(dy,dx);
  player.atkAngle=angle;player.atkTimer=ATK_DURATION;player.atkCd=ATK_CD;
  if(Math.abs(dx)>=Math.abs(dy))player.facing=dx>0?'right':'left';else player.facing=dy>0?'down':'up';
  // Local animation only — server handles damage + kills
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'attack',slimeId:targetSlime.id}));
}

// ── INPUT ──────────────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]){
    if(k===' '){e.preventDefault();let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;dx+=joy.dx;dy+=joy.dy;startRoll(dx,dy);}
  }
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))autoMove=false;
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

c.addEventListener('mousedown',e=>{
  const cx=e.clientX-canvasRect.left,cy=e.clientY-canvasRect.top;
  if(player.dead){const btn=getDeadBtn();if(cx>=btn.x&&cx<=btn.x+btn.w&&cy>=btn.y&&cy<=btn.y+btn.h)resetGame();return;}
  if(isTouchDevice)return;mouseDown=true;pickTarget(cx+cam.x,cy+cam.y);
});
c.addEventListener('mouseup',()=>{mouseDown=false;});
c.addEventListener('mouseleave',()=>{mouseDown=false;});

function touchPos(t){return{x:t.clientX-canvasRect.left,y:t.clientY-canvasRect.top};}
c.addEventListener('touchstart',e=>{
  e.preventDefault();isTouchDevice=true;canvasRect=c.getBoundingClientRect();
  if(player.dead){for(const t of e.changedTouches){const{x,y}=touchPos(t);const btn=getDeadBtn();if(x>=btn.x&&x<=btn.x+btn.w&&y>=btn.y&&y<=btn.y+btn.h){resetGame();return;}}return;}
  for(const t of e.changedTouches){
    const{x,y}=touchPos(t);const atk=getAtkBtn(),roll=getRollBtn();
    if(Math.hypot(x-roll.x,y-roll.y)<roll.r+14){rollBtnFlash=0.2;rollBtnTouchId=t.identifier;startRoll(joy.dx,joy.dy);continue;}
    if(Math.hypot(x-atk.x,y-atk.y)<atk.r+16){
      if(!targetSlime||!targetSlime.alive){let nearest=null,nearestDist=Infinity;for(const s of slimes){if(!s.alive)continue;const d=Math.hypot(s.x-player.x,s.y-player.y);if(d<nearestDist){nearest=s;nearestDist=d;}}if(nearest){nearest.state='aggro';targetSlime=nearest;autoMove=true;autoAttackedOnce=false;}}
      autoAttackedOnce=true;triggerAttackOnTarget();atkBtnFlash=0.2;atkBtnHeld=true;atkBtnTouchId=t.identifier;continue;
    }
    const wx=x+cam.x,wy=y+cam.y;
    let tapped=false;for(const s of slimes){if(!s.alive)continue;if(Math.hypot(wx-s.x,wy-s.y)<s.r+18){pickTarget(wx,wy);tapped=true;break;}}
    if(tapped)continue;
    if(x<c.width*0.6&&!joy.active){joy.active=true;joy.id=t.identifier;joy.bx=x;joy.by=y;joy.kx=x;joy.ky=y;joy.dx=0;joy.dy=0;autoMove=false;}
  }
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(!joy.active||t.identifier!==joy.id)continue;const{x,y}=touchPos(t);const dx=x-joy.bx,dy=y-joy.by,dist=Math.hypot(dx,dy);if(dist<8){joy.dx=0;joy.dy=0;joy.kx=x;joy.ky=y;}else{const cl=Math.min(dist,joy.R);joy.dx=dx/dist;joy.dy=dy/dist;joy.kx=joy.bx+joy.dx*cl;joy.ky=joy.by+joy.dy*cl;}autoMove=false;}
},{passive:false});
c.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(joy.active&&t.identifier===joy.id){joy.active=false;joy.id=-1;joy.dx=0;joy.dy=0;}if(t.identifier===atkBtnTouchId){atkBtnHeld=false;atkBtnTouchId=-1;}if(t.identifier===rollBtnTouchId){rollBtnTouchId=-1;}}
},{passive:false});
c.addEventListener('touchcancel',()=>{joy.active=false;joy.id=-1;joy.dx=0;joy.dy=0;atkBtnHeld=false;atkBtnTouchId=-1;rollBtnTouchId=-1;});

// ── HELPERS ────────────────────────────────────────────────────────────────
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scr=(wx,wy)=>[wx-cam.x,wy-cam.y];
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,spd=35+Math.random()*80;particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,color,sz:2+Math.random()*4,life:0.3+Math.random()*0.4,max:0.7});}}
function addFloat(x,y,text,color,size){floaters.push({x,y,text,color,size,life:0.9,max:0.9,vy:-58});}

function spawnSlime(){
  totalSpawned++;const isGiant=totalSpawned%10===0;
  let x,y,tries=0;do{x=40+Math.random()*(W-80);y=40+Math.random()*(H-80);tries++;}while(Math.hypot(x-player.x,y-player.y)<260&&tries<20);
  slimes.push({x,y,r:isGiant?G_R:S_R,hp:isGiant?G_HP:S_HP,maxHp:isGiant?G_HP:S_HP,
    atk:isGiant?G_ATK:S_ATK,speed:isGiant?G_SPEED:S_SPEED,isGiant,isKing:false,
    bodyCol:isGiant?'#922b21':'#27ae60',shineCol:isGiant?'#e74c3c':'#5bff8a',
    alive:true,kbx:0,kby:0,flash:0,animT:Math.random()*Math.PI*2,
    state:'roam',roamTarget:null,roamTimer:Math.random()*3,
    atkPhase:'idle',atkPhaseTimer:0,normalAtkCd:0.5+Math.random()*1.5,lungeSkillCd:3+Math.random()*3,
    bounceTargetX:0,bounceTargetY:0,hasHit:false,hopArc:0,earthquakeCd:0,earthquakeRadius:0,
    lungeLockedAngle:0,lungeStartX:0,lungeStartY:0,lungeVelX:0,lungeVelY:0});
  if(isGiant)addFloat(x,y-30,'⚠ GIANT','#e74c3c',14);
}

function spawnKing(){
  const angle=Math.random()*Math.PI*2;
  const dist=450+Math.random()*150;
  const x=clamp(W/2+Math.cos(angle)*dist,K_R+20,W-K_R-20);
  const y=clamp(H/2+Math.sin(angle)*dist,K_R+20,H-K_R-20);
  slimes.push({x,y,r:K_R,hp:K_HP,maxHp:K_HP,
    atk:K_NORMAL_ATK,speed:K_SPEED,isGiant:false,isKing:true,
    bodyCol:'#1a0038',shineCol:'#7b00d4',
    alive:true,kbx:0,kby:0,flash:0,animT:Math.random()*Math.PI*2,
    state:'roam',roamTarget:null,roamTimer:0,
    atkPhase:'idle',atkPhaseTimer:0,
    normalAtkCd:2.0,lungeSkillCd:4.0+Math.random()*2,earthquakeCd:5.0+Math.random()*3,
    earthquakeRadius:K_EQ_RADIUS,
    bounceTargetX:0,bounceTargetY:0,hasHit:false,hopArc:0,
    lungeLockedAngle:0,lungeStartX:0,lungeStartY:0,lungeVelX:0,lungeVelY:0});
  addFloat(x,y-50,'⚠ SLIME KING','#a855f7',16);
}

function spawnCracks(cx,cy,radius){
  const num=10+Math.floor(Math.random()*6);
  for(let i=0;i<num;i++){
    const angle=(i/num)*Math.PI*2+(Math.random()-0.5)*0.6;
    const len=radius*(0.25+Math.random()*0.75);
    const pts=[{x:cx,y:cy}];
    let px=cx,py=cy;
    const segs=3+Math.floor(Math.random()*3);
    for(let j=1;j<=segs;j++){
      const t=j/segs, jit=len*0.18;
      px=cx+Math.cos(angle)*len*t+(Math.random()-0.5)*jit*2;
      py=cy+Math.sin(angle)*len*t+(Math.random()-0.5)*jit*2;
      pts.push({x:px,y:py});
    }
    cracks.push({pts,life:1.6+Math.random()*0.6,max:2.2,col:Math.random()<0.6?'#ff4500':'#e67e22'});
  }
}

function resetGame(){
  player.x=W/2;player.y=H/2;player.hp=P_HP;player.regen=0;
  player.facing='down';player.atkCd=0;player.atkTimer=0;player.atkAngle=SWORD_IDLE;player.flash=0;player.dead=false;
  stunned=false;stunTimer=0;
  particles=[];floaters=[];rollTrail=[];cracks=[];
  targetSlime=null;autoMove=false;autoAttackedOnce=false;
  rolling=false;rollTimer=0;rollCd=0;rollInvincible=false;mouseDown=false;
  // Tell server we respawned — server owns the world
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'respawn'}));
}

// ── UPDATE ─────────────────────────────────────────────────────────────────
let last=0;
function update(dt){
  if(player.dead)return;

  // Stun countdown
  if(stunned){stunTimer-=dt;if(stunTimer<=0){stunned=false;stunTimer=0;}}

  if(targetSlime&&!targetSlime.alive){targetSlime=null;autoMove=false;}
  if(targetSlime&&Math.hypot(targetSlime.x-player.x,targetSlime.y-player.y)>380){targetSlime=null;autoMove=false;}

  // Roll
  if(rolling){
    rollTimer-=dt;
    if(rollTimer<=0){rolling=false;rollInvincible=false;}
    else{const prog=1-rollTimer/ROLL_DURATION;player.x=clamp(player.x+Math.cos(rollAngle)*ROLL_SPEED*(1-prog*0.75)*dt,12,W-12);player.y=clamp(player.y+Math.sin(rollAngle)*ROLL_SPEED*(1-prog*0.75)*dt,12,H-12);rollInvincible=prog>0.15&&prog<0.85;if(Math.floor(rollTimer*30)%2===0)rollTrail.push({x:player.x,y:player.y,alpha:0.45});}
  }
  if(rollCd>0)rollCd-=dt;
  rollTrail=rollTrail.filter(t=>{t.alpha-=dt*2.5;return t.alpha>0;});

  // Player actions blocked when stunned
  if(!stunned){
    // Auto-move
    if(autoMove&&targetSlime&&targetSlime.alive&&!rolling){
      const dx=targetSlime.x-player.x,dy=targetSlime.y-player.y,dist=Math.hypot(dx,dy);
      if(dist>ATK_RANGE+targetSlime.r-4){player.x=clamp(player.x+(dx/dist)*P_SPEED*dt,12,W-12);player.y=clamp(player.y+(dy/dist)*P_SPEED*dt,12,H-12);if(Math.abs(dx)>=Math.abs(dy))player.facing=dx>0?'right':'left';else player.facing=dy>0?'down':'up';}
      else if(!autoAttackedOnce&&player.atkCd<=0){triggerAttackOnTarget();autoAttackedOnce=true;autoMove=false;}
    }
    // ATK hold
    if(atkBtnHeld&&player.atkCd<=0&&!rolling){let nearest=null,nearestDist=Infinity;for(const s of slimes){if(!s.alive)continue;const d=Math.hypot(s.x-player.x,s.y-player.y);if(d<nearestDist){nearest=s;nearestDist=d;}}if(nearest){nearest.state='aggro';targetSlime=nearest;autoAttackedOnce=true;}triggerAttackOnTarget();}
    if(mouseDown&&player.atkCd<=0&&targetSlime&&!rolling)triggerAttackOnTarget();
    // Manual movement
    if(!rolling&&!autoMove){
      let dx=0,dy=0;
      if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
      dx+=joy.dx;dy+=joy.dy;const mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag;}
      player.x=clamp(player.x+dx*P_SPEED*dt,12,W-12);player.y=clamp(player.y+dy*P_SPEED*dt,12,H-12);
      if(mag>0.05&&!targetSlime){if(Math.abs(dx)>=Math.abs(dy))player.facing=dx>0?'right':'left';else player.facing=dy>0?'down':'up';}
    }
  }

  if(player.atkCd>0)player.atkCd-=dt;if(player.atkTimer>0)player.atkTimer-=dt;
  if(player.flash>0)player.flash-=dt;if(atkBtnFlash>0)atkBtnFlash-=dt;if(rollBtnFlash>0)rollBtnFlash-=dt;
  player.regen+=dt;if(player.regen>=1){player.regen-=1;player.hp=Math.min(P_HP,player.hp+P_REGEN);}
  cam.x=player.x-c.width/2;cam.y=player.y-c.height/2;

  // Slimes managed by server — no local AI
  particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt;return p.life>0;});
  floaters=floaters.filter(f=>{f.y+=f.vy*dt;f.vy+=22*dt;f.life-=dt;return f.life>0;});
  cracks=cracks.filter(cr=>{cr.life-=dt;return cr.life>0;});

  // ── MULTIPLAYER ─────────────────────────────────────────────────────────
  // Send our state ~20 times/sec
  sendTick+=dt;
  if(ws&&ws.readyState===1&&sendTick>0.05){
    sendTick=0;
    ws.send(JSON.stringify({
      type:'state',
      x:player.x,y:player.y,facing:player.facing,
      hp:player.hp,rolling,
      atkTimer:player.atkTimer,atkAngle:player.atkAngle,
      dead:player.dead,stunned
    }));
  }
  // Interpolate other players toward their latest known position
  for(const p of Object.values(others)){
    p.x+=(p.tx-p.x)*Math.min(1,dt*14);
    p.y+=(p.ty-p.y)*Math.min(1,dt*14);
  }
}

function drawBG(){
  ctx.fillStyle='#11111c';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='rgba(255,255,255,0.027)';ctx.lineWidth=1;
  const gs=80,ox=((-cam.x%gs)+gs)%gs,oy=((-cam.y%gs)+gs)%gs;
  for(let x=ox;x<c.width;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();}
  for(let y=oy;y<c.height;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}
  const[bx,by]=scr(0,0);
  ctx.save();ctx.strokeStyle='rgba(100,130,220,0.5)';ctx.lineWidth=2.5;ctx.setLineDash([12,9]);ctx.strokeRect(bx,by,W,H);ctx.setLineDash([]);
  ctx.strokeStyle='rgba(80,110,200,0.1)';ctx.lineWidth=28;ctx.strokeRect(bx,by,W,H);ctx.restore();
}

function drawSlime(s){
  const[sx,sy]=scr(s.x,s.y);
  const isTarget=s===targetSlime;
  const phase=s.atkPhase;
  const hit=s.flash>0;
  ctx.save();ctx.translate(sx,sy);

  // ── Earthquake AOE circle (drawn first, on ground level) ──────────────
  if(phase==='earthquake_windup'&&s.isKing){
    const prog=1-s.atkPhaseTimer/K_EQ_WINDUP;
    const pulse=Math.sin(Date.now()*0.01)*0.08;
    ctx.save();
    ctx.globalAlpha=0.1+prog*0.15+pulse;
    ctx.fillStyle=`rgb(${Math.floor(180+75*prog)},${Math.floor(40-30*prog)},0)`;
    ctx.beginPath();ctx.arc(0,0,s.earthquakeRadius,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.5+0.3*Math.sin(Date.now()*0.012);
    ctx.strokeStyle=prog>0.65?'#ff0000':'#ff6600';
    ctx.lineWidth=prog>0.65?4:2.5;
    ctx.beginPath();ctx.arc(0,0,s.earthquakeRadius,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // ── Lunge path indicator — red danger beam during windup ─────────────
  if(phase==='lunge_windup'){
    const windupDur2=s.isKing?WINDUP_GIANT:s.isGiant?WINDUP_GIANT:WINDUP_NORMAL;
    const prog2=1-s.atkPhaseTimer/windupDur2;
    const lAngle=s.lungeLockedAngle;
    const pathLen=s.isKing?300:230;
    const hw=s.r*1.15;
    ctx.save();ctx.rotate(lAngle);
    // Fill
    ctx.globalAlpha=0.06+prog2*0.1;ctx.fillStyle='#ff2200';
    ctx.fillRect(s.r,-hw,pathLen,hw*2);
    // Animated dashed edges
    ctx.globalAlpha=0.4+0.3*Math.sin(Date.now()*0.012);
    ctx.strokeStyle=prog2>0.65?'#ff2200':'#ff7700';
    ctx.lineWidth=1.5;ctx.setLineDash([10,7]);
    ctx.beginPath();ctx.moveTo(s.r,-hw);ctx.lineTo(s.r+pathLen,-hw);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s.r,hw);ctx.lineTo(s.r+pathLen,hw);ctx.stroke();
    ctx.setLineDash([]);
    // Arrow tip at end
    ctx.globalAlpha=0.5+0.3*prog2;ctx.fillStyle=prog2>0.65?'#ff2200':'#ff7700';
    ctx.beginPath();ctx.moveTo(s.r+pathLen+12,0);ctx.lineTo(s.r+pathLen-8,-hw*0.7);ctx.lineTo(s.r+pathLen-8,hw*0.7);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Target ring
  if(isTarget){
    const pulse=0.55+0.45*Math.sin(Date.now()*0.006);
    ctx.save();ctx.strokeStyle=s.isKing?'#a855f7':'#f1c40f';ctx.lineWidth=s.isKing?3:2.5;ctx.globalAlpha=pulse;
    ctx.beginPath();ctx.arc(0,0,s.r+7,0,Math.PI*2);ctx.stroke();ctx.restore();
  }

  // Cast bars (above body)
  if(phase==='lunge_windup'){
    const windupDur=s.isKing?WINDUP_GIANT:s.isGiant?WINDUP_GIANT:WINDUP_NORMAL;
    const prog=1-s.atkPhaseTimer/windupDur;
    const bw=s.isKing?68:s.isGiant?68:54,bh=s.isKing?9:8;
    const bx2=-bw/2,by2=-(s.r+(s.isKing?52:32));
    ctx.save();
    ctx.fillStyle=prog>0.65?'#ff2222':'#ff8800';ctx.font=`bold ${s.isKing?12:10}px monospace`;ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('LUNGE',0,by2-2);
    ctx.fillStyle='#222';ctx.fillRect(bx2-1,by2-1,bw+2,bh+2);
    ctx.fillStyle=`rgb(${Math.floor(200+55*prog)},${Math.floor(100-90*prog)},0)`;ctx.fillRect(bx2,by2,Math.ceil(bw*prog),bh);
    if(s.atkPhaseTimer<0.2){ctx.globalAlpha=0.4+0.6*Math.sin(Date.now()*0.04);ctx.strokeStyle='#ff2222';ctx.lineWidth=1.5;ctx.strokeRect(bx2-1,by2-1,bw+2,bh+2);}
    ctx.restore();
  }
  if(phase==='earthquake_windup'){
    const prog=1-s.atkPhaseTimer/K_EQ_WINDUP;
    const bw=90,bh=10,bx2=-bw/2,by2=-(s.r+58);
    ctx.save();
    ctx.fillStyle=prog>0.6?'#ff0000':'#ff6600';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('EARTHQUAKE',0,by2-2);
    ctx.fillStyle='#222';ctx.fillRect(bx2-1,by2-1,bw+2,bh+2);
    const r2=Math.floor(180+75*prog),g2=Math.floor(80-80*prog);
    ctx.fillStyle=`rgb(${r2},${g2},0)`;ctx.fillRect(bx2,by2,Math.ceil(bw*prog),bh);
    if(s.atkPhaseTimer<0.4){ctx.globalAlpha=0.3+0.7*Math.sin(Date.now()*0.035);ctx.strokeStyle='#ff0000';ctx.lineWidth=2;ctx.strokeRect(bx2-1,by2-1,bw+2,bh+2);}
    ctx.restore();
  }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(0,s.r+3,s.r*(phase==='normal_bounce'?1.4:1)*0.7,s.isKing?6:4,0,0,Math.PI*2);ctx.fill();

  const hopArc=s.hopArc||0;
  let body=hit?'#ff8888':s.bodyCol,shine=hit?'#ffcccc':s.shineCol;
  let bob=Math.sin(s.animT*3)*2,scaleX=1,scaleY=1,extraAlpha=1;

  if(phase==='normal_bounce'&&!hit){const prog=1-s.atkPhaseTimer/BOUNCE_DURATION;body=s.isKing?'#5c0070':'#e67e22';shine='rgba(200,80,255,0.9)';scaleX=1+Math.sin(prog*Math.PI)*0.1;scaleY=1-Math.sin(prog*Math.PI)*0.18;bob=0;}
  else if(phase==='lunge_windup'&&!hit){const prog=1-s.atkPhaseTimer/(s.isKing?WINDUP_GIANT:s.isGiant?WINDUP_GIANT:WINDUP_NORMAL);body=s.isKing?`rgb(${Math.floor(40+130*prog)},0,${Math.floor(80+100*prog)})`:(`rgb(${Math.floor(39+216*prog)},${Math.floor(174-150*prog)},${Math.floor(96-90*prog)})`);shine=s.isKing?'rgba(180,0,255,0.8)':`rgba(255,${Math.floor(180-160*prog)},50,0.8)`;scaleX=1+prog*0.18;scaleY=1-prog*0.22;bob=Math.sin(s.animT*(3+prog*8))*2*(1+prog);if(s.atkPhaseTimer<0.18)extraAlpha=0.5+0.5*Math.sin(Date.now()*0.04);}
  else if(phase==='lunge'&&!hit){body=s.isKing?'#8b00ff':'#e67e22';shine='rgba(180,0,255,0.8)';const prog=1-s.atkPhaseTimer/LUNGE_DURATION;const elong=prog<0.5?prog*2:2-prog*2;scaleX=1+elong*0.3;scaleY=1-elong*0.2;}
  else if(phase==='earthquake_windup'&&!hit){body='#3d0066';shine='rgba(150,0,255,0.9)';const prog=1-s.atkPhaseTimer/K_EQ_WINDUP;scaleX=1+prog*0.08;scaleY=1-prog*0.05;if(s.atkPhaseTimer<0.4)extraAlpha=0.5+0.5*Math.sin(Date.now()*0.03);}
  else if(phase==='recovery'&&!hit){const prog=1-s.atkPhaseTimer/RECOVERY_DUR;if(prog<0.4){body='#888';shine='#aaa';}}

  ctx.translate(0,bob+hopArc);ctx.scale(scaleX,scaleY);ctx.globalAlpha=extraAlpha;

  // King outline
  if(s.isKing&&!hit){ctx.strokeStyle=phase==='earthquake_windup'?'#a855f7':'#4a0080';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,s.r,0,Math.PI*2);ctx.stroke();}
  else if(s.isGiant&&!hit){ctx.strokeStyle='#7b241c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,s.r,0,Math.PI*2);ctx.stroke();}

  ctx.fillStyle=body;ctx.beginPath();ctx.arc(0,0,s.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=shine;ctx.beginPath();ctx.arc(-s.r*0.28,-s.r*0.28,s.r*0.38,0,Math.PI*2);ctx.fill();

  // Eyes
  const eyeR=s.isKing?6:s.isGiant?4:3;
  ctx.fillStyle=s.isKing?'#ff0000':'#111128';
  ctx.beginPath();ctx.arc(-s.r*0.28,-s.r*0.1,eyeR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s.r*0.28,-s.r*0.1,eyeR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-s.r*0.28+1.5,-s.r*0.1-1.5,eyeR*0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s.r*0.28+1.5,-s.r*0.1-1.5,eyeR*0.4,0,Math.PI*2);ctx.fill();

  // Mouth — angrier for king
  ctx.strokeStyle=s.isKing?'#ff0000':'#111128';ctx.lineWidth=s.isKing?2.5:1.5;
  if(s.isKing){ctx.beginPath();ctx.moveTo(-s.r*0.35,s.r*0.25);ctx.lineTo(-s.r*0.1,s.r*0.1);ctx.lineTo(s.r*0.1,s.r*0.1);ctx.lineTo(s.r*0.35,s.r*0.25);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0,s.r*0.12,s.r*0.35,0.2,Math.PI-0.2);ctx.stroke();}

  // King crown
  if(s.isKing&&!hit){
    ctx.globalAlpha=1;
    ctx.fillStyle='#f1c40f';
    // Crown base band
    ctx.fillRect(-s.r*0.7,-s.r-6,s.r*1.4,8);
    // Crown spikes
    const spikes=[[0,22],[- s.r*0.45,14],[s.r*0.45,14]];
    for(const[cx2,h]of spikes){ctx.beginPath();ctx.moveTo(cx2-8,-s.r-6);ctx.lineTo(cx2,-s.r-6-h);ctx.lineTo(cx2+8,-s.r-6);ctx.closePath();ctx.fill();}
    // Crown gems
    ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(0,-s.r-4,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(-s.r*0.45,-s.r-4,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(s.r*0.45,-s.r-4,3,0,Math.PI*2);ctx.fill();
  }

  ctx.globalAlpha=1;
  if(s.state==='aggro'&&phase==='idle'){ctx.fillStyle='rgba(255,60,60,0.55)';ctx.beginPath();ctx.arc(0,-s.r*0.85,s.isKing?7:s.isGiant?5:3.5,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function drawOtherChar(op){
  if(op.dead) return;
  const[sx,sy]=scr(op.x,op.y);
  const p=2,atk=op.atkTimer>0;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(sx,sy+13,11,5,0,0,Math.PI*2);ctx.fill();
  // Roll tint
  if(op.rolling){ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#88aaff';ctx.fillRect(sx-14,sy-18,28,34);ctx.restore();}
  // Stun tint
  if(op.stunned){ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#f1c40f';ctx.fillRect(sx-14,sy-18,28,34);ctx.restore();}
  ctx.save();ctx.translate(sx,sy);
  const sAngle=atk?op.atkAngle:SWORD_IDLE;
  let swingOff=0;if(atk){const prog=1-op.atkTimer/ATK_DURATION;swingOff=prog<0.35?-0.45*(prog/0.35):-0.45+0.62*((prog-0.35)/0.65);}
  // Body — slight blue tint to distinguish from local player
  ctx.fillStyle='#2a1a0e';ctx.fillRect(-5*p,6*p,4*p,p);ctx.fillRect(p,6*p,4*p,p);
  ctx.fillStyle='#4a3020';ctx.fillRect(-4*p,3*p,3*p,3*p);ctx.fillRect(p,3*p,3*p,3*p);
  ctx.fillStyle='#5c3a1a';ctx.fillRect(-4*p,2*p,8*p,p);
  ctx.fillStyle='#1e4d6b';ctx.fillRect(-4*p,-p,8*p,3*p); // blue shirt (different from local green)
  ctx.fillStyle='#c09060';ctx.fillRect(-6*p,-p,2*p,3*p);ctx.fillRect(4*p,-p,2*p,3*p);
  ctx.fillStyle='#c09060';ctx.fillRect(-p,-2*p,2*p,p);
  ctx.fillStyle='#c09060';ctx.fillRect(-3*p,-7*p,6*p,5*p);
  ctx.fillStyle='#1a0a4a';ctx.fillRect(-3*p,-7*p,6*p,2*p);ctx.fillRect(-4*p,-6*p,p,3*p);ctx.fillRect(3*p,-6*p,p,3*p);
  if(op.facing!=='up'){ctx.fillStyle='#1a1a2e';ctx.fillRect(-2*p,-5*p,p,p);ctx.fillRect(p,-5*p,p,p);}
  if(!op.rolling){
    ctx.save();ctx.rotate(sAngle+swingOff);
    ctx.fillStyle='#7b4c2a';ctx.fillRect(8,-p,7,p*2);ctx.fillStyle='#b0b0b0';ctx.fillRect(14,-p*2,p*2,p*4);
    ctx.fillStyle='#dcdcdc';ctx.fillRect(16,-p*0.8,22,p*1.6);ctx.fillStyle='rgba(255,255,255,0.65)';ctx.fillRect(16,-p*0.8,22,p*0.55);
    ctx.fillStyle='#dcdcdc';ctx.beginPath();ctx.moveTo(38,-p*0.8);ctx.lineTo(38,p*0.8);ctx.lineTo(44,0);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // Name tag
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-16,-28,32,13);
  ctx.fillStyle='#7fc8ff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(`P${op.id}`,0,-22);ctx.textBaseline='alphabetic';
  ctx.restore();
  // HP bar above name tag
  drawHPBar(op.x,op.y,op.hp,P_HP,40,-36,false,false,false);
}

function drawChar(){
  const[sx,sy]=scr(player.x,player.y);
  const p=2,atk=player.atkTimer>0;
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(sx,sy+13,11,5,0,0,Math.PI*2);ctx.fill();
  if(rolling&&rollInvincible&&Math.floor(Date.now()/60)%2===0)return;
  if(player.flash>0){ctx.save();ctx.globalAlpha=(player.flash/0.25)*0.45;ctx.fillStyle='#e74c3c';ctx.fillRect(sx-14,sy-18,28,34);ctx.restore();}
  if(rolling){ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#88aaff';ctx.fillRect(sx-14,sy-18,28,34);ctx.restore();}
  // Stun tint
  if(stunned){ctx.save();ctx.globalAlpha=0.3+0.2*Math.sin(Date.now()*0.01);ctx.fillStyle='#f1c40f';ctx.fillRect(sx-14,sy-18,28,34);ctx.restore();}
  ctx.save();ctx.translate(sx,sy);
  const sAngle=atk?player.atkAngle:SWORD_IDLE;
  let swingOff=0;if(atk){const prog=1-player.atkTimer/ATK_DURATION;swingOff=prog<0.35?-0.45*(prog/0.35):-0.45+0.62*((prog-0.35)/0.65);}
  ctx.fillStyle='#2a1a0e';ctx.fillRect(-5*p,6*p,4*p,p);ctx.fillRect(p,6*p,4*p,p);
  ctx.fillStyle='#4a3020';ctx.fillRect(-4*p,3*p,3*p,3*p);ctx.fillRect(p,3*p,3*p,3*p);
  ctx.fillStyle='#5c3a1a';ctx.fillRect(-4*p,2*p,8*p,p);
  ctx.fillStyle='#2d5c2d';ctx.fillRect(-4*p,-p,8*p,3*p);
  ctx.fillStyle='#c09060';ctx.fillRect(-6*p,-p,2*p,3*p);ctx.fillRect(4*p,-p,2*p,3*p);
  ctx.fillStyle='#c09060';ctx.fillRect(-p,-2*p,2*p,p);
  ctx.fillStyle='#c09060';ctx.fillRect(-3*p,-7*p,6*p,5*p);
  ctx.fillStyle='#2e1a0a';ctx.fillRect(-3*p,-7*p,6*p,2*p);ctx.fillRect(-4*p,-6*p,p,3*p);ctx.fillRect(3*p,-6*p,p,3*p);
  if(player.facing!=='up'){ctx.fillStyle='#1a1a2e';ctx.fillRect(-2*p,-5*p,p,p);ctx.fillRect(p,-5*p,p,p);}
  if(!rolling){
    ctx.save();ctx.rotate(sAngle+swingOff);
    ctx.fillStyle='#7b4c2a';ctx.fillRect(8,-p,7,p*2);ctx.fillStyle='#b0b0b0';ctx.fillRect(14,-p*2,p*2,p*4);
    ctx.fillStyle='#dcdcdc';ctx.fillRect(16,-p*0.8,22,p*1.6);ctx.fillStyle='rgba(255,255,255,0.65)';ctx.fillRect(16,-p*0.8,22,p*0.55);
    ctx.fillStyle='#dcdcdc';ctx.beginPath();ctx.moveTo(38,-p*0.8);ctx.lineTo(38,p*0.8);ctx.lineTo(44,0);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // Stun stars
  if(stunned){
    const t=Date.now()*0.004;
    for(let i=0;i<4;i++){const a=t+(i*Math.PI/2);const sx2=Math.cos(a)*16,sy2=-16+Math.sin(a)*6;ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(sx2,sy2,3,0,Math.PI*2);ctx.fill();}
  }
  ctx.restore();
}

function drawRollTrail(){for(const t of rollTrail){const[tsx,tsy]=scr(t.x,t.y);ctx.save();ctx.globalAlpha=t.alpha;ctx.fillStyle='#88aaff';ctx.beginPath();ctx.ellipse(tsx,tsy,8,11,rollAngle,0,Math.PI*2);ctx.fill();ctx.restore();}}

function drawHPBar(wx,wy,hp,max,bw,yOff,isPlayer,isGiant,isKing){
  const[sx,sy]=scr(wx,wy),x=sx-bw/2,y=sy+yOff,bh=isKing?10:isGiant?7:5;
  ctx.fillStyle='#111';ctx.fillRect(x-1,y-1,bw+2,bh+2);
  const ratio=Math.max(0,hp/max);
  ctx.fillStyle=isPlayer?(ratio>0.6?'#2ecc40':ratio>0.3?'#f39c12':'#e74c3c'):isKing?'#a855f7':'#e74c3c';
  ctx.fillRect(x,y,Math.ceil(bw*ratio),bh);
  if(isPlayer){ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(`${Math.ceil(hp)}/${max}`,sx,y-3);}
  if(isKing){ctx.fillStyle='#f1c40f';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(`👑 ${Math.ceil(hp)}/${max}`,sx,y-3);}
}

function drawCracks(){
  for(const cr of cracks){
    if(cr.pts.length<2) continue;
    const alpha=cr.life/cr.max;
    ctx.save();ctx.globalAlpha=alpha*0.7;
    ctx.strokeStyle=cr.col;ctx.lineWidth=1.5+alpha*1.5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    const[x0,y0]=scr(cr.pts[0].x,cr.pts[0].y);ctx.moveTo(x0,y0);
    for(let i=1;i<cr.pts.length;i++){const[xi,yi]=scr(cr.pts[i].x,cr.pts[i].y);ctx.lineTo(xi,yi);}
    ctx.stroke();ctx.restore();
  }
}

function drawParticles(){for(const p of particles){const[sx,sy]=scr(p.x,p.y);ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.fillRect(sx-p.sz/2,sy-p.sz/2,p.sz,p.sz);}ctx.globalAlpha=1;}
function drawFloaters(){ctx.textBaseline='middle';for(const f of floaters){const[sx,sy]=scr(f.x,f.y);ctx.globalAlpha=Math.min(1,f.life/(f.max*0.4));ctx.fillStyle=f.color;ctx.font=`bold ${f.size}px monospace`;ctx.textAlign='center';ctx.fillText(f.text,sx,sy);}ctx.globalAlpha=1;ctx.textBaseline='alphabetic';}

function drawMinimap(){
  const mw=140,mh=140,mx=c.width-mw-12,my=c.height-mh-12,pad=5;
  ctx.fillStyle='rgba(8,8,18,0.88)';ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#3a4060';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  const sx=(mw-pad*2)/W,sy=(mh-pad*2)/H;
  ctx.strokeStyle='rgba(100,130,220,0.35)';ctx.lineWidth=1;ctx.strokeRect(mx+pad,my+pad,mw-pad*2,mh-pad*2);
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.strokeRect(mx+pad+(player.x-c.width/2)*sx,my+pad+(player.y-c.height/2)*sy,c.width*sx,c.height*sy);
  for(const s of slimes){
    if(!s.alive)continue;
    const kx=mx+pad+s.x*sx,ky=my+pad+s.y*sy;
    if(s.isKing){
      // Crown icon for king
      ctx.save();ctx.translate(kx,ky);
      ctx.fillStyle='#f1c40f';
      ctx.fillRect(-5,-1,10,5);
      ctx.beginPath();ctx.moveTo(-5,-1);ctx.lineTo(-3,-6);ctx.lineTo(-1,-1);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-1,-1);ctx.lineTo(1,-8);ctx.lineTo(3,-1);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(3,-1);ctx.lineTo(5,-5);ctx.lineTo(7,-1);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#a855f7';ctx.lineWidth=0.8;ctx.strokeRect(-5,-1,10,5);
      ctx.restore();
    } else {
      ctx.fillStyle=s===targetSlime?'#f1c40f':s.isGiant?'#e74c3c':s.state==='aggro'?'#ff6b6b':'#2ecc40';
      ctx.beginPath();ctx.arc(kx,ky,s.isGiant?4:2.5,0,Math.PI*2);ctx.fill();
    }
  }
  const px=mx+pad+player.x*sx,py=my+pad+player.y*sy;
  ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7fc8ff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#445';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('MAP',mx+5,my+12);
}

function drawHUD(){
  const bw=175;
  ctx.fillStyle='rgba(8,8,18,0.82)';ctx.fillRect(10,10,bw+10,75);
  ctx.strokeStyle='#2a3050';ctx.lineWidth=1;ctx.strokeRect(10,10,bw+10,75);
  ctx.fillStyle='#556';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('HERO',15,23);
  ctx.fillStyle='#1a1a2e';ctx.fillRect(15,27,bw,18);
  const hr=Math.max(0,player.hp/P_HP);
  ctx.fillStyle=hr>0.6?'#2ecc40':hr>0.3?'#f39c12':'#e74c3c';ctx.fillRect(15,27,Math.floor(bw*hr),18);
  ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(`${Math.ceil(player.hp)} / ${P_HP}`,15+bw/2,40);
  ctx.fillStyle=player.atkCd>0?'#888':'#f1c40f';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText(player.atkCd>0?`ATK ${player.atkCd.toFixed(1)}s`:'ATK RDY',15,58);
  ctx.fillStyle=rollCd>0?'#888':'#88aaff';ctx.fillText(rollCd>0?`ROLL ${rollCd.toFixed(1)}s`:'ROLL RDY',90,58);
  ctx.fillStyle='#3a8a3a';ctx.fillText(`♥ +${P_REGEN}/s`,15,70);

  // Stun bar
  if(stunned){
    ctx.fillStyle='rgba(20,15,0,0.9)';ctx.fillRect(10,84,bw+10,24);
    ctx.strokeStyle='#f1c40f';ctx.lineWidth=1;ctx.strokeRect(10,84,bw+10,24);
    ctx.fillStyle='#1a1a00';ctx.fillRect(15,88,bw,12);
    ctx.fillStyle='#f1c40f';ctx.fillRect(15,88,Math.ceil(bw*(stunTimer/STUN_DURATION)),12);
    ctx.fillStyle='#f1c40f';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('★ STUNNED ★',15+bw/2,96);
  } else if(targetSlime){
    ctx.fillStyle='rgba(8,8,18,0.88)';ctx.fillRect(10,84,bw+10,38);
    ctx.strokeStyle=targetSlime.isKing?'#a855f7':'#f1c40f';ctx.lineWidth=1;ctx.strokeRect(10,84,bw+10,38);
    ctx.fillStyle=targetSlime.isKing?'#a855f7':'#f1c40f';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText((targetSlime.isKing?'👑 SLIME KING':targetSlime.isGiant?'TARGET: GIANT':'TARGET: SLIME')+(autoMove?' [APPROACHING]':''),15,97);
    ctx.fillStyle='#1a1a2e';ctx.fillRect(15,101,bw,8);
    ctx.fillStyle=targetSlime.isKing?'#a855f7':'#e74c3c';ctx.fillRect(15,101,Math.ceil(bw*Math.max(0,targetSlime.hp/targetSlime.maxHp)),8);
    ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(`${Math.max(0,targetSlime.hp)} / ${targetSlime.maxHp}`,15+bw/2,111);
  } else {
    ctx.fillStyle='rgba(8,8,18,0.82)';ctx.fillRect(10,84,bw+10,28);
    ctx.strokeStyle='#2a3050';ctx.lineWidth=1;ctx.strokeRect(10,84,bw+10,28);
    const alive=slimes.filter(s=>s.alive&&!s.isKing).length,giants=slimes.filter(s=>s.alive&&s.isGiant).length;
    const kingAlive=slimes.some(s=>s.alive&&s.isKing);
    ctx.fillStyle='#556';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText(`SLIMES: ${alive}/${MAX_SLIMES}${giants>0?` ⚠${giants}G`:''}${kingAlive?' 👑':''}  SPAWN: ${Math.ceil(Math.max(0,spawnT))}s`,15,97);
    ctx.fillStyle='#334';ctx.fillText('Click a slime to target',15,107);
  }

  // Connection status (top right)
  const dotCol={'online':'#2ecc40','connecting':'#f39c12','reconnecting':'#f39c12','offline':'#e74c3c'}[wsStatus]||'#e74c3c';
  const pCount=Object.keys(others).length+1;
  ctx.fillStyle='rgba(8,8,18,0.75)';ctx.fillRect(c.width-140,10,130,22);
  ctx.fillStyle=dotCol;ctx.beginPath();ctx.arc(c.width-128,21,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';ctx.font='9px monospace';ctx.textAlign='left';
  ctx.fillText(wsStatus==='online'?`${pCount} player${pCount!==1?'s':''} online`:wsStatus,c.width-119,24);

  if(!isTouchDevice){
    ctx.fillStyle='rgba(8,8,18,0.6)';ctx.fillRect(10,c.height-52,268,42);
    ctx.fillStyle='#445';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText('WASD  Move       Click mob  Target',15,c.height-37);
    ctx.fillText('Hold click  Attack   Space  Dodge',15,c.height-25);
    ctx.fillText('Roll out of EARTHQUAKE range!',15,c.height-13);
  }
}

function drawTouchControls(){
  if(!isTouchDevice)return;
  if(!joy.active){ctx.save();ctx.globalAlpha=0.13;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(85,c.height-120,joy.R,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=0.16;ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MOVE',85,c.height-120);ctx.textBaseline='alphabetic';ctx.restore();}
  else{ctx.save();ctx.globalAlpha=0.22;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.R,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=0.1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.R,0,Math.PI*2);ctx.fill();ctx.globalAlpha=0.55;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.kx,joy.ky,joy.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  const atk=getAtkBtn(),atkP=atkBtnFlash>0||atkBtnHeld;
  ctx.save();ctx.globalAlpha=atkP?0.55:0.22;ctx.strokeStyle='#f39c12';ctx.lineWidth=atkP?3:2;ctx.beginPath();ctx.arc(atk.x,atk.y,atk.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=atkP?0.35:0.12;ctx.fillStyle='#f39c12';ctx.beginPath();ctx.arc(atk.x,atk.y,atk.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=atkP?0.95:0.5;ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ATK',atk.x,atk.y);ctx.textBaseline='alphabetic';ctx.restore();
  const roll=getRollBtn(),rollP=rollBtnFlash>0,rollReady=rollCd<=0;
  ctx.save();ctx.globalAlpha=rollReady?(rollP?0.65:0.28):0.12;ctx.strokeStyle='#88aaff';ctx.lineWidth=rollP?3:2;ctx.beginPath();ctx.arc(roll.x,roll.y,roll.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=rollReady?(rollP?0.35:0.1):0.06;ctx.fillStyle='#88aaff';ctx.beginPath();ctx.arc(roll.x,roll.y,roll.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=rollReady?(rollP?0.95:0.45):0.2;ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(rollCd>0?rollCd.toFixed(1):'ROLL',roll.x,roll.y);ctx.textBaseline='alphabetic';ctx.restore();
}

function drawDead(){
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#e74c3c';ctx.font='bold 52px monospace';ctx.textAlign='center';ctx.fillText('YOU DIED',c.width/2,c.height/2-16);
  const btn=getDeadBtn();
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(btn.x+3,btn.y+3,btn.w,btn.h);
  ctx.fillStyle='#c0392b';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(btn.x,btn.y,btn.w,3);
  ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('RESPAWN',c.width/2,btn.y+btn.h/2+7);
}

function draw(){
  drawBG();
  for(const s of slimes){if(!s.alive)continue;drawSlime(s);drawHPBar(s.x,s.y,s.hp,s.maxHp,s.isKing?70:s.isGiant?54:38,-s.r-(s.isKing?18:12),false,s.isGiant,s.isKing);}
  drawCracks();drawParticles();drawRollTrail();
  for(const op of Object.values(others)) drawOtherChar(op);
  drawChar();
  drawHPBar(player.x,player.y,player.hp,P_HP,54,-44,true,false,false);
  drawFloaters();drawHUD();drawMinimap();drawTouchControls();
  if(player.dead)drawDead();
}

function loop(ts){const dt=Math.min((ts-last)/1000,0.05);last=ts;update(dt);draw();requestAnimationFrame(loop);}
// World spawned by server
requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(loop);});
</script>
</body>
</html>
